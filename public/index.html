<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Искра" />
<title>Искра</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --sidebar-bg: #f9f9f9;
    --bg-elevated: #f4f4f5;
    --hover: #ececee;
    --border: #e6e6e6;
    --text: #0d0d0d;
    --text-muted: #6e6e78;
    --accent: #10a37f;
    --send-bg: #0d0d0d;
    --send-ink: #ffffff;
    --bubble-user: #f4f4f5;
    --code-bg: #0d0d0d;
    --code-text: #e6e6ea;
    --danger: #c0362c;
    --danger-bg: #fbeae8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #212121;
      --sidebar-bg: #171717;
      --bg-elevated: #2a2a2a;
      --hover: #2f2f2f;
      --border: #2f2f2f;
      --text: #ececec;
      --text-muted: #8e8ea0;
      --accent: #19c37d;
      --send-bg: #ececec;
      --send-ink: #0d0d0d;
      --bubble-user: #2f2f2f;
      --code-bg: #0a0a0a;
      --code-text: #e6e6ea;
      --danger: #ff8a7a;
      --danger-bg: #3a2220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #212121;
    --sidebar-bg: #171717;
    --bg-elevated: #2a2a2a;
    --hover: #2f2f2f;
    --border: #2f2f2f;
    --text: #ececec;
    --text-muted: #8e8ea0;
    --accent: #19c37d;
    --send-bg: #ececec;
    --send-ink: #0d0d0d;
    --bubble-user: #2f2f2f;
    --code-bg: #0a0a0a;
    --code-text: #e6e6ea;
    --danger: #ff8a7a;
    --danger-bg: #3a2220;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation; /* убирает зум по двойному тапу, пинч-зум остаётся */
    -webkit-text-size-adjust: 100%;
  }
  button, .suggestion, .chat-item, .new-chat, .account-row {
    touch-action: manipulation;
  }

  .shell {
    height: 100dvh;
    display: flex;
    background: var(--bg);
  }

  /* --- боковая панель --- */
  .sidebar {
    width: 268px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.18s ease;
    overflow: hidden;
  }
  .sidebar.collapsed { margin-left: -268px; }

  .sidebar-top { padding: 12px; display: flex; flex-direction: column; gap: 6px; }

  .new-chat {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  .new-chat:hover { background: var(--hover); }
  .new-chat svg { width: 17px; height: 17px; flex-shrink: 0; }

  .sidebar-search {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .sidebar-search svg { width: 15px; height: 15px; flex-shrink: 0; }
  .sidebar-search input {
    border: none; background: transparent; outline: none;
    font-family: inherit; font-size: 13px; color: var(--text);
    width: 100%;
  }
  .sidebar-search input::placeholder { color: var(--text-muted); }

  .sidebar-list { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .group-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    padding: 14px 8px 6px;
  }
  .chat-item {
    position: relative;
    display: flex; align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text);
  }
  .chat-item:hover { background: var(--hover); }
  .chat-item.active { background: var(--bg-elevated); }
  .chat-item .title {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-item .del {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    display: none;
    align-items: center; justify-content: center;
    cursor: pointer;
  }
  .chat-item:hover .del { display: flex; }
  .chat-item .del:hover { background: var(--border); color: var(--danger); }
  .chat-item .del svg { width: 13px; height: 13px; }

  .sidebar-empty { padding: 10px 8px; color: var(--text-muted); font-size: 12.5px; }

  .sidebar-bottom { padding: 10px; border-top: 1px solid var(--border); }
  .account-row {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 8px;
    border-radius: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
  }
  .account-row:hover { background: var(--hover); }
  .account-row .chip {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .account-row .who { flex: 1; min-width: 0; }
  .account-row .who .name { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .account-row .who .sub { font-size: 11.5px; color: var(--text-muted); }
  .account-row svg.gear { width: 17px; height: 17px; color: var(--text-muted); flex-shrink: 0; }

  /* --- главная колонка --- */
  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }

  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    flex-shrink: 0;
  }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 19px; height: 19px; }
  .topbar .title { font-size: 15px; font-weight: 700; }
  .topbar .title-mark { width: 22px; height: 22px; object-fit: contain; margin-left: 2px; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px;
  }

  /* --- приветственный экран --- */
  .welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 26px;
    padding-bottom: 60px;
  }
  .welcome .mark-lg {
    width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center;
  }
  .welcome .mark-lg img { width: 100%; height: 100%; object-fit: contain; }
  .welcome h2 {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 560px;
  }
  .suggestion {
    text-align: left;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 15px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    line-height: 1.4;
  }
  .suggestion:hover { background: var(--hover); }
  .suggestion .emoji { font-size: 16px; display: block; margin-bottom: 6px; }

  /* --- сообщения (без пузырей и аватаров у ассистента — как в ChatGPT) --- */
  #thread {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
    padding: 24px 0 20px;
  }

  .msg { display: flex; animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--bubble-user);
    border-radius: 20px;
    padding: 10px 16px;
    max-width: 78%;
  }

  .msg.assistant .bubble { width: 100%; }

  .bubble { font-size: 15.5px; line-height: 1.7; }
  .bubble p { margin: 0 0 14px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 14px; padding-left: 22px; }
  .bubble li { margin-bottom: 4px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05em; margin: 18px 0 8px; }
  .bubble strong { font-weight: 700; }
  .bubble a { color: inherit; text-decoration: underline; }
  .bubble code {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.85em;
    background: var(--bg-elevated);
    padding: 2px 5px;
    border-radius: 4px;
  }
  .bubble pre {
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0 0 14px;
  }
  .bubble pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }

  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--text);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

  .thinking { display: flex; gap: 4px; padding: 4px 0; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.1s ease-in-out infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking span { animation: none; opacity: 0.7; } }

  .notice {
    align-self: center;
    max-width: 92%;
    margin: 0 auto;
    text-align: center;
    font-size: 13.5px;
    color: var(--danger);
    background: var(--danger-bg);
    padding: 10px 16px;
    border-radius: 10px;
  }

  /* --- композер --- */
  .composer-wrap { flex-shrink: 0; padding: 8px 20px 18px; }
  #form {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 10px 10px 10px 20px;
  }
  #form:focus-within { border-color: var(--text-muted); }

  textarea {
    flex: 1;
    resize: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    min-height: 24px;
    max-height: 160px;
    padding: 6px 0;
  }
  textarea::placeholder { color: var(--text-muted); }

  button.send {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--send-bg);
    color: var(--send-ink);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.send svg { width: 15px; height: 15px; }
  button.send:disabled { opacity: 0.3; cursor: default; }
  button.send:not(:disabled):hover { filter: brightness(1.15); }

  .hint { max-width: 760px; margin: 10px auto 0; text-align: center; font-size: 11.5px; color: var(--text-muted); }

  /* --- модалка настроек --- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 11, 14, 0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 440px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .modal-head h2 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .modal-sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--text-muted); }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .field .counter { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .modal-actions {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
    margin-top: 6px;
  }
  .btn-primary, .btn-ghost {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--send-bg); color: var(--send-ink); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { color: var(--danger); }

  .privacy-note {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--bg-elevated);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .privacy-note svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  .sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 19;
  }

  @media (max-width: 760px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; }
    .sidebar-backdrop.show { display: block; }
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button type="button" class="new-chat" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Новый чат
        </button>
        <label class="sidebar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchChats" placeholder="Поиск по чатам">
        </label>
      </div>
      <div class="sidebar-list" id="sidebarList"></div>
      <div class="sidebar-bottom">
        <button type="button" class="account-row" id="accountBtn">
          <span class="chip" id="chip">?</span>
          <span class="who">
            <span class="name" id="accountName">Гость</span>
            <span class="sub">Настройки</span>
          </span>
          <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <div class="topbar">
        <button type="button" class="icon-btn" id="sidebarToggle" title="Свернуть/развернуть панель" aria-label="Свернуть/развернуть панель">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <img src="/logo.png" alt="" class="title-mark">
        <span class="title">Искра</span>
      </div>

      <main id="main">
        <div id="welcome" class="welcome">
          <div class="mark-lg">
            <img src="/logo.png" alt="Искра">
          </div>
          <h2>Чем помочь сегодня?</h2>
          <div class="suggestions" id="suggestions">
            <button type="button" class="suggestion" data-text="Объясни простыми словами, что такое рекурсия в программировании">
              <span class="emoji">💡</span>Объясни простыми словами, что такое рекурсия
            </button>
            <button type="button" class="suggestion" data-text="Составь план тренировок на неделю для новичка">
              <span class="emoji">🏋️</span>Составь план тренировок на неделю
            </button>
            <button type="button" class="suggestion" data-text="Напиши короткое поздравление с днём рождения другу в шутливом тоне">
              <span class="emoji">🎉</span>Напиши поздравление с днём рождения
            </button>
            <button type="button" class="suggestion" data-text="Помоги составить резюме для позиции менеджера проектов">
              <span class="emoji">📄</span>Помоги составить резюме
            </button>
          </div>
        </div>
        <div id="thread" hidden></div>
      </main>

      <div class="composer-wrap">
        <form id="form">
          <textarea id="input" placeholder="Напишите сообщение…" rows="1"></textarea>
          <button class="send" id="send" type="submit" disabled>
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 20V4M12 4L5 11M12 4L19 11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <p class="hint">Искра может ошибаться. Проверяйте важные факты.</p>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Персонализация</h2>
        <button type="button" class="icon-btn" id="closeModal" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-sub">Искра будет учитывать это в каждом ответе.</p>

      <div class="privacy-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
        <span>Хранится только в этом браузере (localStorage). При каждом сообщении отправляется вместе с ним в OpenAI, чтобы формировать персонализированный ответ.</span>
      </div>

      <form id="profileForm">
        <div class="field-row">
          <div class="field">
            <label for="pName">Как вас зовут</label>
            <input type="text" id="pName" maxlength="80" placeholder="Например, Данияр" autocomplete="off">
          </div>
          <div class="field" style="max-width: 110px;">
            <label for="pAge">Возраст</label>
            <input type="number" id="pAge" min="1" max="120" placeholder="27" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="pOccupation">Чем занимаетесь</label>
          <input type="text" id="pOccupation" maxlength="150" placeholder="Например, дизайнер, учусь в 11 классе, веду свой бизнес…" autocomplete="off">
        </div>

        <div class="field">
          <label for="pAbout">Что ещё важно знать о вас</label>
          <textarea id="pAbout" maxlength="600" placeholder="Интересы, проекты, предпочтения — что угодно, что поможет отвечать точнее"></textarea>
          <div class="counter"><span id="pAboutCount">0</span>/600</div>
        </div>

        <div class="field">
          <label for="pStyle">Как Искра должна отвечать</label>
          <textarea id="pStyle" maxlength="600" placeholder="Например: коротко и по делу, без воды; объясняй как новичку; можно с юмором"></textarea>
          <div class="counter"><span id="pStyleCount">0</span>/600</div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="clearProfile">Очистить всё</button>
          <button type="submit" class="btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const mainEl = document.getElementById('main');
  const welcomeEl = document.getElementById('welcome');
  const threadEl = document.getElementById('thread');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const sidebar = document.getElementById('sidebar');
  const sidebarList = document.getElementById('sidebarList');
  const searchChats = document.getElementById('searchChats');
  const welcomeHeading = document.querySelector('#welcome h2');

  let turns = [];
  let busy = false;
  let currentChatId = null;

  marked.setOptions({ breaks: true });

  // ---------- Профиль / персонализация ----------
  const PROFILE_KEY = 'iskra_profile';
  function loadProfile() {
    try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveProfile(p) {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch {}
  }
  let profile = loadProfile();

  const accountBtn = document.getElementById('accountBtn');
  const chip = document.getElementById('chip');
  const accountName = document.getElementById('accountName');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const closeModal = document.getElementById('closeModal');
  const profileForm = document.getElementById('profileForm');
  const clearProfileBtn = document.getElementById('clearProfile');

  const fields = {
    name: document.getElementById('pName'),
    age: document.getElementById('pAge'),
    occupation: document.getElementById('pOccupation'),
    about: document.getElementById('pAbout'),
    style: document.getElementById('pStyle'),
  };
  const counters = {
    about: document.getElementById('pAboutCount'),
    style: document.getElementById('pStyleCount'),
  };

  function refreshChrome() {
    const initial = (profile.name || 'Г').trim().charAt(0).toUpperCase() || 'Г';
    chip.textContent = initial;
    accountName.textContent = profile.name || 'Гость';
    if (!currentChatId) {
      welcomeHeading.textContent = profile.name ? `Чем помочь, ${profile.name}?` : 'Чем помочь сегодня?';
    }
  }

  function fillForm() {
    fields.name.value = profile.name || '';
    fields.age.value = profile.age || '';
    fields.occupation.value = profile.occupation || '';
    fields.about.value = profile.about || '';
    fields.style.value = profile.style || '';
    counters.about.textContent = fields.about.value.length;
    counters.style.textContent = fields.style.value.length;
  }

  function openModal() { fillForm(); modalBackdrop.hidden = false; fields.name.focus(); }
  function hideModal() { modalBackdrop.hidden = true; }

  accountBtn.addEventListener('click', openModal);
  closeModal.addEventListener('click', hideModal);
  modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) hideModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modalBackdrop.hidden) hideModal(); });
  fields.about.addEventListener('input', () => { counters.about.textContent = fields.about.value.length; });
  fields.style.addEventListener('input', () => { counters.style.textContent = fields.style.value.length; });

  profileForm.addEventListener('submit', (e) => {
    e.preventDefault();
    profile = {
      name: fields.name.value.trim(),
      age: fields.age.value.trim(),
      occupation: fields.occupation.value.trim(),
      about: fields.about.value.trim(),
      style: fields.style.value.trim(),
    };
    saveProfile(profile);
    refreshChrome();
    hideModal();
  });

  clearProfileBtn.addEventListener('click', () => {
    profile = {};
    saveProfile(profile);
    fillForm();
    refreshChrome();
  });

  // ---------- История чатов (боковая панель) ----------
  const CHATS_KEY = 'iskra_chats';
  function loadChats() {
    try { return JSON.parse(localStorage.getItem(CHATS_KEY)) || {}; }
    catch { return {}; }
  }
  function saveChats(chats) {
    try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch {}
  }

  function groupLabel(ts) {
    const d = new Date(ts), now = new Date();
    const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
    if (days <= 0) return 'Сегодня';
    if (days === 1) return 'Вчера';
    if (days <= 7) return 'Предыдущие 7 дней';
    return 'Ранее';
  }

  function renderSidebar() {
    const chats = loadChats();
    const q = searchChats.value.trim().toLowerCase();
    const list = Object.values(chats)
      .filter((c) => !q || c.title.toLowerCase().includes(q))
      .sort((a, b) => b.updatedAt - a.updatedAt);

    sidebarList.innerHTML = '';
    if (!list.length) {
      sidebarList.innerHTML = `<div class="sidebar-empty">${q ? 'Ничего не найдено' : 'Пока нет чатов'}</div>`;
      return;
    }

    let lastGroup = null;
    for (const c of list) {
      const g = groupLabel(c.updatedAt);
      if (g !== lastGroup) {
        lastGroup = g;
        const label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = g;
        sidebarList.appendChild(label);
      }
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
      item.innerHTML = `<span class="title"></span><button type="button" class="del" title="Удалить" aria-label="Удалить чат"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>`;
      item.querySelector('.title').textContent = c.title;
      item.addEventListener('click', (e) => {
        if (e.target.closest('.del')) return;
        openChat(c.id);
      });
      item.querySelector('.del').addEventListener('click', (e) => {
        e.stopPropagation();
        const all = loadChats();
        delete all[c.id];
        saveChats(all);
        if (c.id === currentChatId) startNewChat();
        renderSidebar();
      });
      sidebarList.appendChild(item);
    }
  }

  function persistCurrentChat() {
    if (!turns.length) return;
    const chats = loadChats();
    if (!currentChatId) currentChatId = crypto.randomUUID();
    const firstUser = turns.find((t) => t.role === 'user');
    const title = (firstUser?.content || 'Новый чат').slice(0, 48);
    chats[currentChatId] = { id: currentChatId, title, turns, updatedAt: Date.now() };
    saveChats(chats);
    renderSidebar();
  }

  function openChat(id) {
    const chats = loadChats();
    const c = chats[id];
    if (!c) return;
    currentChatId = id;
    turns = c.turns.slice();
    threadEl.innerHTML = '';
    for (const t of turns) {
      if (t.role === 'user') addUserMessage(t.content);
      else renderFinal(addAssistantMessage(), t.content);
    }
    showThread();
    renderSidebar();
    closeSidebarOnMobile();
  }

  function startNewChat() {
    currentChatId = null;
    turns = [];
    threadEl.innerHTML = '';
    threadEl.hidden = true;
    welcomeEl.hidden = false;
    refreshChrome();
    renderSidebar();
    input.focus();
    closeSidebarOnMobile();
  }

  document.getElementById('newChatBtn').addEventListener('click', startNewChat);
  searchChats.addEventListener('input', renderSidebar);

  // ---------- Сворачивание боковой панели ----------
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  function isMobile() { return window.matchMedia('(max-width: 760px)').matches; }

  function setSidebarOpen(open) {
    sidebar.classList.toggle('collapsed', !open);
    sidebarBackdrop.classList.toggle('show', open && isMobile());
  }
  function closeSidebarOnMobile() { if (isMobile()) setSidebarOpen(false); }

  sidebarToggle.addEventListener('click', () => setSidebarOpen(sidebar.classList.contains('collapsed')));
  sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
  window.addEventListener('resize', () => { if (!isMobile()) sidebarBackdrop.classList.remove('show'); });
  if (isMobile()) setSidebarOpen(false);

  refreshChrome();
  renderSidebar();

  // ---------- Сообщения ----------
  function showThread() {
    welcomeEl.hidden = true;
    threadEl.hidden = false;
  }

  function scrollDown() { mainEl.scrollTop = mainEl.scrollHeight; }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    threadEl.appendChild(row);
    scrollDown();
  }

  function addAssistantMessage() {
    const row = document.createElement('div');
    row.className = 'msg assistant';
    row.innerHTML = `<div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
    threadEl.appendChild(row);
    scrollDown();
    return row.querySelector('.bubble');
  }

  function renderStreaming(bubble, text) {
    bubble.innerHTML = marked.parse(text) + '<span class="cursor"></span>';
    scrollDown();
  }
  function renderFinal(bubble, text) {
    bubble.innerHTML = text ? marked.parse(text) : '';
  }
  function addNotice(text) {
    const el = document.createElement('div');
    el.className = 'notice';
    el.textContent = text;
    threadEl.appendChild(el);
    scrollDown();
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', () => {
    autoResize();
    sendBtn.disabled = !input.value.trim() || busy;
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) form.requestSubmit();
    }
  });

  document.getElementById('suggestions').addEventListener('click', (e) => {
    const btn = e.target.closest('.suggestion');
    if (!btn) return;
    input.value = btn.dataset.text;
    autoResize();
    sendBtn.disabled = false;
    form.requestSubmit();
  });

  async function streamChat(bubble) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: turns, profile }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || ('Ошибка ' + res.status));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data:')) continue;
        const payload = part.slice(5).trim();
        if (payload === '[DONE]') return full;
        let parsed;
        try { parsed = JSON.parse(payload); } catch { continue; }
        if (parsed.error) throw new Error(parsed.error);
        if (parsed.text) { full += parsed.text; renderStreaming(bubble, full); }
      }
    }
    return full;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;

    showThread();
    addUserMessage(text);
    turns.push({ role: 'user', content: text });
    input.value = '';
    autoResize();
    busy = true;
    sendBtn.disabled = true;

    const bubble = addAssistantMessage();

    try {
      const full = await streamChat(bubble);
      renderFinal(bubble, full);
      turns.push({ role: 'assistant', content: full });
      persistCurrentChat();
    } catch (err) {
      bubble.closest('.msg').remove();
      addNotice('Ошибка: ' + err.message);
      turns.pop();
    } finally {
      busy = false;
      sendBtn.disabled = !input.value.trim();
      input.focus();
      scrollDown();
    }
  });
</script>
</body>
</html>
